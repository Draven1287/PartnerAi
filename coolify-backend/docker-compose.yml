services:
  learning-ai-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learningai}
      POSTGRES_USER: ${POSTGRES_USER:-learningai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - learning-ai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  learning-ai-minutes:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8787
      DATA_FILE: /app/data/minutes.json
      POSTGRES_HOST: learning-ai-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-learningai}
      POSTGRES_USER: ${POSTGRES_USER:-learningai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://learningai4you.com,https://www.learningai4you.com,https://api.learningai4you.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      BUILD_SHA: ${BUILD_SHA:-local}
      BUILD_TIME: ${BUILD_TIME:-unknown}
    expose:
      - "8787"
    volumes:
      - learning-ai-minutes-data:/app/data
    depends_on:
      learning-ai-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>r.json()).then(j=>process.exit(j.ok&&j.dbStatus==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  learning-ai-minutes-data:
  learning-ai-postgres-data:
