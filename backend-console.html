<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backend Console · Learning AI</title>
<!--
  Admin Backend Console for Learning AI.
  Recreated from the Claude Design file "Backend Console.dc.html".
  Plain HTML/CSS/JS to match the rest of this static site (no React/build step).
  Requires real admin sign-in through POST /api/admin/login.
  Reads live Postgres-backed data from GET /api/admin/overview via backend-client.js.
  If the API is unavailable, the console shows a real error instead of placeholder learner rows.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .bc { --bw:1px; min-height: 100vh; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  .bc[data-theme="light"] { --bg:#f6f3ea; --surface:#fffdf8; --surface-2:#efe8d8; --border:#e4dcc9; --text:#211f1a; --text-dim:#5d5749; --text-faint:#8c8573; --accent:#3a3aa3; --accent-dim:#2c2c84; --accent-soft:rgba(58,58,163,.10); --good:#1f8a5b; --good-soft:rgba(31,138,91,.12); --bad:#c2414b; --bad-soft:rgba(194,65,75,.12); --warn:#b6802a; --warn-soft:rgba(182,128,42,.14); --on-accent:#fff; --shadow:rgba(40,33,20,.08); }
  .bc[data-theme="dark"] { --bg:#16140f; --surface:#211e18; --surface-2:#2b271f; --border:#3a352b; --text:#f3efe6; --text-dim:#b3ab9a; --text-faint:#857e6e; --accent:#a6a4f2; --accent-dim:#bcbaf6; --accent-soft:rgba(166,164,242,.16); --good:#4cc38a; --good-soft:rgba(76,195,138,.16); --bad:#f0808a; --bad-soft:rgba(240,128,138,.16); --warn:#e0a64d; --warn-soft:rgba(224,166,77,.16); --on-accent:#16140f; --shadow:rgba(0,0,0,.45); }

  .bc-canvas { max-width: 1180px; margin: 0 auto; padding: 0 24px 80px; }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--bg) 84%, transparent); border-bottom: var(--bw) solid var(--border); }
  .bar-in { max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
  .brand .mk { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); }
  .brand .sub { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); padding: 3px 8px; border: var(--bw) solid var(--border); border-radius: 999px; }
  .spacer { flex: 1; }
  .conn { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; border: var(--bw) solid var(--border); cursor: pointer; background: var(--surface); color: var(--text-dim); }
  .conn .dot { width: 9px; height: 9px; border-radius: 50%; }
  .conn.ok { color: var(--good); border-color: color-mix(in srgb,var(--good) 40%,var(--border)); background: var(--good-soft); } .conn.ok .dot { background: var(--good); animation: pulse 2s infinite; }
  .conn.warn { color: var(--warn); border-color: color-mix(in srgb,var(--warn) 40%,var(--border)); background: var(--warn-soft); } .conn.warn .dot { background: var(--warn); }
  .conn.bad { color: var(--bad); border-color: color-mix(in srgb,var(--bad) 40%,var(--border)); background: var(--bad-soft); } .conn.bad .dot { background: var(--bad); }
  @keyframes pulse { 0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);} 70%{ box-shadow:0 0 0 7px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }
  .seg { display: inline-flex; background: var(--surface-2); border: var(--bw) solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--text-dim); font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px var(--shadow); }

  /* head */
  .head { padding: 26px 0 4px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .head .kick { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }
  .head h1 { font-family:"Newsreader",serif; font-weight: 500; font-size: clamp(26px,3.6vw,38px); letter-spacing:-.015em; margin: 8px 0 0; }
  .head .env { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; font-family:"JetBrains Mono",monospace; }
  .head .env b { color: var(--accent); }
  .pending-flag { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); border: var(--bw) solid color-mix(in srgb,var(--warn) 35%,var(--border)); padding: 7px 13px; border-radius: 999px; }
  .live-flag { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--good); background: var(--good-soft); border: var(--bw) solid color-mix(in srgb,var(--good) 35%,var(--border)); padding: 7px 13px; border-radius: 999px; }
  .live-flag .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); animation: pulse 2s infinite; }

  /* tab nav */
  .tabnav { display: flex; gap: 4px; margin: 22px 0 4px; border-bottom: var(--bw) solid var(--border); flex-wrap: wrap; }
  .tabnav button { border: 0; background: transparent; color: var(--text-dim); font: inherit; font-size: 14px; font-weight: 600; padding: 11px 15px; border-radius: 10px 10px 0 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .12s, background .12s; }
  .tabnav button:hover { color: var(--text); background: var(--surface-2); }
  .tabnav button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabnav button .badge { font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--text-faint); padding: 1px 7px; border-radius: 999px; }
  .tabnav button.on .badge { background: var(--accent-soft); color: var(--accent); }

  /* kpi */
  .kpis { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin: 22px 0; }
  @media (max-width:780px){ .kpis { grid-template-columns: repeat(2,1fr); } }
  .kpi { background: var(--surface); border: var(--bw) solid var(--border); border-radius: 16px; padding: 18px 20px; box-shadow: 0 8px 26px var(--shadow); }
  .kpi .l { font-size: 12.5px; color: var(--text-dim); font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .kpi .v { font-family:"Newsreader",serif; font-weight: 500; font-size: 36px; line-height: 1; letter-spacing:-.01em; margin: 12px 0 6px; }
  .kpi .d { font-size: 12px; font-weight: 600; }
  .kpi .d.up { color: var(--good); } .kpi .d.flat { color: var(--text-faint); }

  .panel { background: var(--surface); border: var(--bw) solid var(--border); border-radius: 18px; box-shadow: 0 8px 26px var(--shadow); overflow: hidden; }
  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 14px; flex-wrap: wrap; }
  .panel-h h2 { font-family:"Newsreader",serif; font-weight: 500; font-size: 20px; margin: 0; }
  .panel-h .meta { font-size: 12.5px; color: var(--text-faint); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width:820px){ .grid2 { grid-template-columns: 1fr; } }

  /* search */
  .search { display: flex; align-items: center; gap: 9px; background: var(--surface-2); border: var(--bw) solid var(--border); border-radius: 11px; padding: 9px 13px; width: 280px; max-width: 100%; }
  .search input { border: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; width: 100%; outline: none; }
  .search input::placeholder { color: var(--text-faint); }
  .search .ic { color: var(--text-faint); flex: none; }

  /* table */
  .tbl-scroll { max-height: 620px; overflow-y: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl thead th { position: sticky; top: 0; z-index: 1; text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; padding: 10px 22px; border-bottom: var(--bw) solid var(--border); background: var(--surface-2); }
  .tbl thead th.num, .tbl tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tbody td { padding: 12px 22px; border-bottom: var(--bw) solid var(--border); vertical-align: middle; }
  .tbl tbody tr { cursor: pointer; transition: background .12s; }
  .tbl tbody tr:hover { background: var(--surface-2); }
  .tbl tbody tr.sel { background: var(--accent-soft); }
  .who { display: flex; align-items: center; gap: 11px; }
  .ava { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
  .who .nm { font-weight: 600; color: var(--text); }
  .who .em { font-size: 12px; color: var(--text-faint); font-family:"JetBrains Mono",monospace; }
  .lvl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .lvl.Foundation { color: var(--warn); background: var(--warn-soft); }
  .lvl.Explorer { color: var(--accent); background: var(--accent-soft); }
  .lvl.Builder { color: var(--good); background: var(--good-soft); }
  .lprog { display: flex; align-items: center; gap: 9px; }
  .lprog .track { width: 70px; height: 7px; border-radius: 999px; background: var(--surface-2); border: var(--bw) solid var(--border); overflow: hidden; }
  .lprog .fill { height: 100%; background: var(--accent); }
  .lprog .n { font-size: 12px; color: var(--text-dim); font-weight: 600; font-variant-numeric: tabular-nums; }
  .seen { color: var(--text-dim); }
  .seen.cold { color: var(--bad); }
  .empty { padding: 40px 22px; text-align: center; color: var(--text-faint); font-size: 14px; }

  /* learner detail */
  .detail-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; padding: 4px 22px 20px; }
  @media (max-width:600px){ .detail-grid { grid-template-columns: 1fr 1fr; } }
  .dcell { background: var(--surface-2); border: var(--bw) solid var(--border); border-radius: 12px; padding: 13px 15px; }
  .dcell .l { font-size: 11px; letter-spacing:.05em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }
  .dcell .v { font-size: 15px; font-weight: 600; margin-top: 5px; }
  .dcell .v.mono { font-family:"JetBrains Mono",monospace; font-size: 13px; }
  .learners-2col { display: grid; grid-template-columns: minmax(0,1fr) 358px; gap: 18px; align-items: start; }
  @media (max-width:900px){ .learners-2col { grid-template-columns: 1fr; } }
  .detail-panel { position: sticky; top: 78px; }
  .detail-grid.side { grid-template-columns: 1fr 1fr; padding: 4px 18px 20px; }

  /* distribution */
  .dist { padding: 8px 22px 22px; display: grid; gap: 16px; }
  .dist-row .top { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
  .dist-row .top .c { color: var(--text-faint); }
  .dist-row .track { height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: var(--bw) solid var(--border); }
  .dist-row .fill { height: 100%; border-radius: 999px; }
  .age-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding: 0 22px 22px; }
  @media (max-width:600px){ .age-grid { grid-template-columns: 1fr 1fr; } }
  .agecell { background: var(--surface-2); border: var(--bw) solid var(--border); border-radius: 12px; padding: 13px 15px; }
  .agecell .n { font-family:"Newsreader",serif; font-size: 22px; font-weight: 500; }
  .agecell .l { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* questions */
  .subtabs { display: flex; gap: 7px; padding: 4px 22px 16px; flex-wrap: wrap; }
  .subtabs button { border: var(--bw) solid var(--border); background: var(--surface); color: var(--text-dim); font: inherit; font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px; cursor: pointer; }
  .subtabs button:hover { border-color: var(--accent); color: var(--accent); }
  .subtabs button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .qbody { padding: 0 22px 24px; }
  .qbody .qt { font-family:"Newsreader",serif; font-weight: 500; font-size: 22px; line-height: 1.2; margin: 4px 0 18px; max-width: 60ch; }
  .qopt-dist { display: grid; gap: 11px; }
  .qopt-row { display: grid; grid-template-columns: 26px 1fr; gap: 13px; align-items: start; }
  .qopt-row .letter { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-dim); border: var(--bw) solid var(--border); }
  .qopt-row.best .letter { background: var(--good); color: #fff; border-color: var(--good); }
  .qopt-row .body .txt { font-size: 14px; line-height: 1.45; margin-bottom: 7px; }
  .qopt-row .body .meter { display: flex; align-items: center; gap: 10px; }
  .qopt-row .body .track { flex: 1; height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: var(--bw) solid var(--border); }
  .qopt-row .body .fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .qopt-row.best .body .fill { background: var(--good); }
  .qopt-row .body .pct { font-size: 12.5px; font-weight: 700; color: var(--text-dim); min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
  .qsummary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  @media (max-width:560px){ .qsummary { grid-template-columns: 1fr; } }
  .qs-cell { border: var(--bw) solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .qs-cell.best { background: var(--good-soft); border-color: color-mix(in srgb,var(--good) 35%,var(--border)); }
  .qs-cell.weak { background: var(--surface-2); }
  .qs-l { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing:.03em; text-transform: uppercase; }
  .qs-cell.best .qs-l { color: var(--good); }
  .qs-cell.weak .qs-l { color: var(--text-faint); }
  .qs-v { font-family:"Newsreader",serif; font-weight: 500; font-size: 34px; line-height: 1; margin: 8px 0 5px; letter-spacing:-.01em; }
  .qs-cell.best .qs-v { color: var(--good); }
  .qs-s { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }
  .qnote { font-size: 12.5px; color: var(--text-faint); margin: 18px 0 0; line-height: 1.5; }

  /* visits */
  .spark { display: flex; align-items: flex-end; gap: 10px; height: 200px; padding: 20px 24px 8px; }
  .spark .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
  .spark .col .bar { width: 100%; max-width: 48px; background: var(--accent); border-radius: 6px 6px 0 0; transition: background .12s; }
  .spark .col .bv { font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .spark .col .bx { font-size: 12px; color: var(--text-faint); font-weight: 600; }
  .vstats { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; padding: 8px 24px 24px; }
  @media (max-width:680px){ .vstats { grid-template-columns: repeat(2,1fr); } }
  .vstat { background: var(--surface-2); border: var(--bw) solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .vstat .n { font-family:"Newsreader",serif; font-size: 24px; font-weight: 500; }
  .vstat .l { font-size: 12px; color: var(--text-dim); margin-top: 3px; line-height: 1.35; }

  /* connection diagnostics */
  .diag { padding: 6px 24px 24px; }
  .diag .url { font-family:"JetBrains Mono",monospace; font-size: 12.5px; color: var(--text-dim); background: var(--surface-2); border: var(--bw) solid var(--border); border-radius: 9px; padding: 10px 13px; margin-bottom: 16px; word-break: break-all; }
  .check { display: flex; align-items: center; gap: 13px; padding: 13px 0; border-bottom: var(--bw) solid var(--border); }
  .check:last-child { border-bottom: 0; }
  .check .ic { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
  .check .ic.ok { background: var(--good); } .check .ic.bad { background: var(--bad); } .check .ic.warn { background: var(--warn); } .check .ic.pend { background: var(--surface-2); color: var(--text-faint); border: var(--bw) solid var(--border); }
  .check .tx { flex: 1; }
  .check .tx .t { font-size: 14px; font-weight: 600; }
  .check .tx .s { font-size: 12.5px; color: var(--text-faint); margin-top: 2px; line-height: 1.4; }
  .check .ms { font-size: 12px; color: var(--text-faint); font-family:"JetBrains Mono",monospace; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 11px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: var(--bw) solid transparent; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .diag-note { font-size: 12.5px; color: var(--text-faint); margin-top: 16px; line-height: 1.55; }

  .preview-foot { padding: 14px 22px; border-top: var(--bw) solid var(--border); text-align: right; }
  .linkbtn { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .foot { margin-top: 22px; font-size: 12.5px; color: var(--text-faint); line-height: 1.6; }

  /* admin login gate */
  .login-wrap { min-height: calc(100vh - 130px); display: grid; place-items: center; padding: 40px 0; }
  .login-card { width: 100%; max-width: 420px; background: var(--surface); border: var(--bw) solid var(--border); border-radius: 20px; box-shadow: 0 18px 50px var(--shadow); padding: 34px 34px 30px; }
  .login-mk { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); display: grid; place-items: center; margin-bottom: 18px; }
  .login-kick { font-size: 11px; letter-spacing:.14em; text-transform:uppercase; color: var(--text-faint); font-weight: 700; }
  .login-h { font-family:"Newsreader",serif; font-weight: 500; font-size: 30px; letter-spacing:-.015em; margin: 6px 0 8px; }
  .login-sub { font-size: 14px; color: var(--text-dim); line-height: 1.55; margin: 0 0 20px; }
  .login-err { font-size: 13px; font-weight: 600; color: var(--bad); background: var(--bad-soft); border: var(--bw) solid color-mix(in srgb,var(--bad) 35%,var(--border)); border-radius: 10px; padding: 10px 13px; margin-bottom: 14px; }
  .login-fields { display: grid; gap: 11px; margin-bottom: 18px; }
  .login-inp { width: 100%; padding: 13px 15px; border: var(--bw) solid var(--border); border-radius: 11px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 15px; outline: none; }
  .login-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .login-inp::placeholder { color: var(--text-faint); }
  .login-btn { width: 100%; justify-content: center; font-size: 15px; padding: 13px; }
  .login-actions { display: grid; gap: 9px; margin-bottom: 16px; }
  .login-actions .btn { justify-content: center; text-decoration: none; }
  .login-foot { font-size: 12px; color: var(--text-faint); line-height: 1.5; margin: 16px 0 0; }
  .state-card { max-width: 680px; margin: 34px auto 0; background: var(--surface); border: var(--bw) solid var(--border); border-radius: 18px; box-shadow: 0 8px 26px var(--shadow); padding: 24px; }
  .state-card h2 { font-family:"Newsreader",serif; font-weight: 500; font-size: 24px; margin: 0 0 8px; }
  .state-card p { margin: 0 0 16px; color: var(--text-dim); line-height: 1.55; }
</style>
</head>
<body>
<div id="app"></div>

<!-- backend bridge: config sets the URL, v2 client exposes adminOverview() -->
<script src="./backend-config.js"></script>
<script src="./backend-client.js"></script>
<script>
