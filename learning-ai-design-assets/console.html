<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>LearningAI console</title>
  <style>
    /* Design tokens carried over from the V2 backend console so this looks like
       the rest of the product rather than a debug page. Dark theme follows the
       operating system; the sticky bar and paper-tone surfaces are the same. */
    :root{
      --bg:#f6f3ea; --surface:#fffdf8; --surface-2:#efe8d8; --border:#e4dcc9;
      --text:#211f1a; --text-dim:#5d5749; --text-faint:#8c8573;
      --accent:#3a3aa3; --accent-soft:rgba(58,58,163,.10); --on-accent:#fff;
      --good:#1f8a5b; --bad:#c2414b; --shadow:rgba(40,33,20,.08);
      color-scheme:light;
      font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#16140f; --surface:#211e18; --surface-2:#2b271f; --border:#3a352b;
        --text:#f3efe6; --text-dim:#b3ab9a; --text-faint:#857e6e;
        --accent:#a6a4f2; --accent-soft:rgba(166,164,242,.16); --on-accent:#16140f;
        --good:#4cc38a; --bad:#f0808a; --shadow:rgba(0,0,0,.45);
        color-scheme:dark;
      }
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .bar{position:sticky;top:0;z-index:30;padding:16px 0;backdrop-filter:blur(10px);
      background:color-mix(in srgb,var(--bg) 84%,transparent);border-bottom:1px solid var(--border)}
    .bar-inner,main{max-width:1180px;margin:0 auto;padding:0 24px}
    main{padding-bottom:80px}
    h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
    .sub{margin:4px 0 0;color:var(--text-dim);font-size:13px;line-height:1.5}
    .card{margin:18px 0;padding:22px;border:1px solid var(--border);border-radius:14px;
      background:var(--surface);box-shadow:0 1px 2px var(--shadow)}
    .card h2{margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:-.01em}
    .card p.hint{margin:0 0 14px;color:var(--text-dim);font-size:13px;line-height:1.5}
    label{display:grid;gap:6px;margin-bottom:12px;color:var(--text-dim);font-size:11px;
      font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    input{height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;
      background:var(--bg);color:var(--text);font:inherit;font-size:14px}
    input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    button{min-height:40px;padding:0 16px;border:1px solid var(--accent);border-radius:10px;
      background:var(--accent);color:var(--on-accent);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    button.ghost{border-color:var(--border);background:var(--surface-2);color:var(--text)}
    button:disabled{opacity:.5;cursor:not-allowed}
    button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .status{min-height:20px;margin:12px 0 0;color:var(--text-dim);font-size:13px}
    .status.bad{color:var(--bad)}
    .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .tile{padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
    .tile b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em}
    .tile span{display:block;margin-top:4px;color:var(--text-dim);font-size:11px;
      letter-spacing:.04em;text-transform:uppercase}
    .scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
    th{color:var(--text-faint);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
    tbody tr:hover{background:var(--accent-soft)}
    .empty{padding:14px;border:1px dashed var(--border);border-radius:10px;color:var(--text-faint);font-size:13px}
    details summary{cursor:pointer;color:var(--text-faint);font-size:12px;margin-top:10px}
    pre{overflow:auto;margin:10px 0 0;padding:12px;border-radius:10px;background:var(--surface-2);
      color:var(--text-dim);font-size:12px;line-height:1.5}
    code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:.92em}
    a{color:var(--accent)}
    #app[hidden]{display:none}
    @media(max-width:640px){.bar-inner,main{padding:0 16px}.card{padding:18px}}
  </style>
</head>
<body>
<header class="bar"><div class="bar-inner">
  <h1>LearningAI console</h1>
  <p class="sub">Live data from the production database, through <code>/api/admin/*</code>. Read-only.</p>
</div></header>
<main>

  <section class="card" id="loginCard">
    <h2>Sign in</h2>
    <p class="hint">Use the ADMIN_EMAIL and ADMIN_PASSWORD set on the <code>learning-ai-api</code> service in Railway.</p>
    <form id="loginForm" autocomplete="off">
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <div class="row"><button type="submit">Sign in</button></div>
    </form>
    <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
  </section>

  <div id="app" hidden>
    <section class="card">
      <div class="row" style="justify-content:space-between">
        <div><h2>Overview</h2><p class="hint" id="who"></p></div>
        <div class="row">
          <button class="ghost" id="refresh" type="button">Refresh</button>
          <button class="ghost" id="signout" type="button">Sign out</button>
        </div>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>
    <section class="card"><h2>Learners</h2><div class="scroll" id="learners"></div></section>
    <section class="card"><h2>Lesson analytics</h2><div class="scroll" id="lessons"></div></section>
    <section class="card"><h2>Questionnaire answers</h2><div class="scroll" id="assessment"></div></section>
    <section class="card">
      <h2>Health</h2>
      <div class="scroll" id="health"></div>
    </section>
  </div>
</main>

<script>
/* Deliberately renders whatever the API returns rather than assuming a fixed
   shape. The previous consoles were templates whose placeholders nothing ever
   filled, so they shipped as literal "{{ head }}" text. */
const $ = s => document.querySelector(s);
const loginStatus = $('#loginStatus');

async function api(path, options = {}) {
  try {
    const response = await fetch(path, {
      credentials: 'include',
      headers: { 'content-type': 'application/json' },
      ...options
    });
    const data = await response.json().catch(() => ({}));
    return { ...data, ok: response.ok && data.ok !== false, status: response.status };
  } catch (error) {
    return { ok: false, error: 'network_error', status: 0 };
  }
}

const esc = value => String(value ?? '').replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

function table(rows) {
  if (!Array.isArray(rows) || !rows.length) return '<p class="empty">Nothing recorded yet.</p>';
  const cols = [...new Set(rows.flatMap(r => Object.keys(r || {})))];
  const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = rows.slice(0, 200).map(r => '<tr>' + cols.map(c => {
    let v = r?.[c];
    if (v && typeof v === 'object') v = JSON.stringify(v);
    if (typeof v === 'string' && /^\d{4}-\d\d-\d\dT/.test(v)) v = v.slice(0, 16).replace('T', ' ');
    return `<td>${esc(v)}</td>`;
  }).join('') + '</tr>').join('');
  const more = rows.length > 200 ? `<p class="hint">Showing 200 of ${rows.length}.</p>` : '';
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${more}`;
}

function tiles(overview) {
  const skip = new Set(['ok', 'csrfToken', 'status']);
  const entries = Object.entries(overview || {})
    .filter(([k, v]) => !skip.has(k) && (typeof v === 'number' || typeof v === 'string'));
  if (!entries.length) return '<p class="empty">No summary figures returned.</p>';
  return entries.map(([k, v]) =>
    `<div class="tile"><b>${esc(v)}</b><span>${esc(k.replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase())}</span></div>`
  ).join('');
}

function section(el, payload, key) {
  const rows = Array.isArray(payload?.[key]) ? payload[key]
    : Array.isArray(payload) ? payload
    : Object.values(payload || {}).find(Array.isArray);
  el.innerHTML = table(rows) +
    `<details><summary>Raw response</summary><pre>${esc(JSON.stringify(payload, null, 2)).slice(0, 6000)}</pre></details>`;
}

async function load() {
  $('#refresh').disabled = true;
  const [overview, learners, lessons, assessment, health] = await Promise.all([
    api('/api/admin/overview'),
    api('/api/admin/learners'),
    api('/api/admin/lesson-analytics'),
    api('/api/admin/assessment-analytics'),
    api('/api/health')
  ]);
  if (!overview.ok && overview.status === 401) return showLogin('Your admin session expired. Sign in again.');
  $('#tiles').innerHTML = tiles(overview);
  section($('#learners'), learners, 'learners');
  section($('#lessons'), lessons, 'analytics');
  section($('#assessment'), assessment, 'analytics');
  $('#health').innerHTML = table([health]);
  $('#refresh').disabled = false;
}

function showLogin(message) {
  $('#app').hidden = true;
  $('#loginCard').hidden = false;
  loginStatus.textContent = message || '';
  loginStatus.className = message ? 'status bad' : 'status';
}

function showApp(admin) {
  $('#loginCard').hidden = true;
  $('#app').hidden = false;
  $('#who').textContent = admin?.email ? `Signed in as ${admin.email}` : 'Signed in';
  load();
}

$('#loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.currentTarget));
  loginStatus.className = 'status';
  loginStatus.textContent = 'Signing in…';
  const result = await api('/api/admin/login', { method: 'POST', body: JSON.stringify(data) });
  if (!result.ok) {
    loginStatus.className = 'status bad';
    loginStatus.textContent = result.error === 'rate_limited'
      ? 'Too many attempts. Wait a few minutes.'
      : result.error === 'network_error'
        ? 'Could not reach the service.'
        : 'That email and password did not work.';
    return;
  }
  showApp(result.admin || result.user);
});

$('#refresh').addEventListener('click', load);
$('#signout').addEventListener('click', async () => {
  await api('/api/admin/logout', { method: 'POST' });
  showLogin('Signed out.');
});

/* Opened straight off disk, every fetch('/api/...') resolves against file://
   and fails, which looked identical to the service being down. Say what is
   actually wrong. */
if (location.protocol !== 'http:' && location.protocol !== 'https:') {
  $('#loginForm').hidden = true;
  loginStatus.className = 'status bad';
  loginStatus.innerHTML = 'This page is open from a file on your computer, so it cannot reach the API. '
    + 'Open <a href="https://learningai4you.com/console.html">learningai4you.com/console.html</a> instead.';
} else {
  // resume an existing admin session
  api('/api/admin/me').then(result => { if (result.ok) showApp(result.admin || result.user); });
}
</script>
</body>
</html>
