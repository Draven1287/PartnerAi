<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LearningAI</title>
  <meta name="description" content="Learn how to use AI without handing over your judgment.">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#171a18}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#efeee9 url("./learning-ai-paper-light-v1.jpg") center/cover fixed no-repeat}
    main{width:min(560px,calc(100vw - 34px));padding:32px;border:1px solid rgba(255,255,255,.82);border-radius:30px;background:rgba(255,255,255,.42);box-shadow:0 24px 70px rgba(30,34,31,.12),inset 0 1px rgba(255,255,255,.92);backdrop-filter:blur(24px) saturate(1.12);-webkit-backdrop-filter:blur(24px) saturate(1.12)}
    p{margin:0;color:#59605c;font-size:15px;line-height:1.55}
    strong{display:block;margin-bottom:8px;color:#171a18;font-size:22px;letter-spacing:-.03em}
    a{color:#171a18}
  </style>
  <script src="./learning-api.js?v=2026-07-25j"></script>
</head>
<body>
  <main aria-live="polite">
    <strong>Opening LearningAI…</strong>
    <p>Taking you to the next step in your learning journey. <a href="./lesson-one.html">Start Lesson 1</a></p>
  </main>
  <script>
    (async() => {
      const params = new URLSearchParams(location.search);
      const review = params.get('review') === '1';
      if (review) {
        location.replace('./stage-1-navigation-proof.html?review=1');
        return;
      }
      const session = await window.LearningAIAPI.me();
      if (session.ok) {
        const savedState = await window.LearningAIAPI.state();
        if (savedState.ok) window.LearningAIAPI.hydrateLocalState(savedState.state);
      }
      const lessonFinished = localStorage.getItem('learningai-first-lesson-pending') || localStorage.getItem('learningai-first-lesson-complete');
      const account = localStorage.getItem('learningai-prototype-account');
      const questions = localStorage.getItem('learningai-diagnostic-prototype');
      const destination = !lessonFinished
        ? './lesson-one.html'
        : !account
          ? './access.html'
          : !questions
            ? './onboarding.html'
            : './stage-1-navigation-proof.html';
      location.replace(destination);
    })();
  </script>
</body>
</html>
