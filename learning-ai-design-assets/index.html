<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LearningAI</title>
  <meta name="description" content="Learn how to use AI without handing over your judgment.">
  <link rel="stylesheet" href="./theme.css?v=2026-07-25w">
  <script src="./learning-api.js?v=2026-07-25w"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#171a18}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      background:#efeee9 url("./learning-ai-paper-light-v1.jpg") center/cover fixed no-repeat}
    .pane{width:min(620px,100%);padding:clamp(34px,6vw,58px);border:1px solid rgba(255,255,255,.86);
      border-radius:32px;background:linear-gradient(150deg,rgba(255,255,255,.52),rgba(255,255,255,.16) 58%,rgba(220,227,224,.24));
      box-shadow:inset 0 1px 1px rgba(255,255,255,.96),0 30px 90px rgba(38,42,40,.14);
      backdrop-filter:blur(26px) saturate(1.25);-webkit-backdrop-filter:blur(26px) saturate(1.25)}
    .mark{display:grid;width:40px;height:40px;place-items:center;border:1px solid rgba(45,42,32,.16);
      border-radius:13px;background:rgba(255,255,255,.5);color:#a8843f;font-size:17px;
      box-shadow:inset 0 1px 1px #fff}
    h1{margin:26px 0 0;font-size:clamp(34px,5.4vw,50px);font-weight:520;letter-spacing:-.05em;line-height:1.02}
    p.lead{max-width:26em;margin:18px 0 0;color:#555c58;font-size:16px;line-height:1.6}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
    .go{display:inline-flex;align-items:center;min-height:50px;padding:0 22px;border:1px solid #29302d;
      border-radius:15px;background:#29302d;color:#fff;font:inherit;font-size:14px;font-weight:700;text-decoration:none}
    .quiet{display:inline-flex;align-items:center;min-height:50px;padding:0 18px;border:1px solid rgba(39,45,42,.16);
      border-radius:15px;background:rgba(255,255,255,.44);color:#252b28;font:inherit;font-size:14px;font-weight:650;text-decoration:none}
    .go:focus-visible,.quiet:focus-visible{outline:3px solid #17231f;outline-offset:3px}
    .note{margin:20px 0 0;color:#6a716c;font-size:12.5px;line-height:1.55}
    @media(max-width:520px){.actions{display:grid}.go,.quiet{justify-content:center}}
  </style>
</head>
<body>
  <main class="pane">
    <span class="mark" aria-hidden="true">&#9678;</span>
    <h1>Use AI without handing over your thinking.</h1>
    <p class="lead">Start with one lesson. No account, no payment, nothing to set up. If you want to keep going after that, you make an account and the rest opens.</p>
    <div class="actions">
      <a class="go" href="./lesson-one.html">Start the first lesson</a>
      <a class="quiet" href="./access.html?returning=1">I already have an account</a>
    </div>
    <p class="note">Built for ages 13 and up. All 50 lessons are free.</p>
  </main>
  <script>
    /* A returning learner should not be shown a welcome screen. Send them where
       they left off; only a genuine first visit sees this page. */
    (async () => {
      const params = new URLSearchParams(location.search);
      if (params.get('review') === '1') { location.replace('./stage-1-navigation-proof.html?review=1'); return; }
      const session = await window.LearningAIAPI.me();
      if (session.ok) {
        const state = await window.LearningAIAPI.state();
        if (state.ok) window.LearningAIAPI.hydrateLocalState(state.state);
      }
      const done = localStorage.getItem('learningai-first-lesson-pending') || localStorage.getItem('learningai-first-lesson-complete');
      const account = localStorage.getItem('learningai-prototype-account');
      const questions = localStorage.getItem('learningai-diagnostic-prototype');
      if (!done && !account) return;                       // first visit: stay here
      if (!done) { location.replace('./lesson-one.html'); return; }
      if (!account) { location.replace('./access.html'); return; }
      location.replace(questions ? './stage-1-navigation-proof.html' : './onboarding.html');
    })();
  </script>
</body>
</html>
