<script id="curriculum" type="application/json">{"lessons":[{"id":"chapter-1","num":1,"arc":"First Contact","title":"The Machine That Predicts","coreQuestion":"What is an AI assistant actually doing when it answers me?","blurb":"Say three sentence-endings out loud, then watch an AI do the same trick — and learn what it's really doing.","minutes":8},{"id":"chapter-2","num":2,"arc":"First Contact","title":"Tools That Scared Us First","coreQuestion":"Is feeling nervous about AI a sign it's uniquely dangerous, or just the normal reaction to every powerful new tool?","blurb":"Writing, the printing press, the calculator — every big tool scared people first. AI is the newest one in that line.","minutes":8},{"id":"chapter-3","num":3,"arc":"First Contact","title":"Your First Conversation","coreQuestion":"How do I actually start talking to an AI — and what really happens when I do?","blurb":"Type one message, press send, read the reply. That's the whole thing.","minutes":7},{"id":"chapter-4","num":4,"arc":"First Contact","title":"You Can't Break It","coreQuestion":"What actually happens when I type the \"wrong\" thing, and can I damage the AI?","blurb":"Type the messiest message you can, watch it cope, and prove the redo is free.","minutes":7},{"id":"chapter-5","num":5,"arc":"First Contact","title":"How It Learns","coreQuestion":"Where do the AI's answers come from — its training, or the live web?","blurb":"Most answers come from patterns it learned. But it can also go look things up live.","minutes":9},{"id":"chapter-6","num":6,"arc":"How It Works","title":"How It Creates","coreQuestion":"How can one AI tool write, draw, and speak — and what is it actually doing when it \"makes\" a picture?","blurb":"The same next-piece engine that finishes sentences can also build a brand-new image or voice — piece by piece.","minutes":9},{"id":"chapter-7","num":7,"arc":"How It Works","title":"Confidently Wrong","coreQuestion":"Why can AI sound completely certain and still be wrong — and what should I do about it?","blurb":"A made-up detail sounds just as sure as a true one. You can't feel the difference — you have to check.","minutes":8},{"id":"chapter-8","num":8,"arc":"How It Works","title":"What It Is NOT","coreQuestion":"When an AI says \"I think\" or \"I'm here for you,\" who is the \"I\" — and what is actually happening?","blurb":"The warmth is a writing style, not a mind. Learn to catch human-sounding lines and translate what's really going on.","minutes":8},{"id":"chapter-9","num":9,"arc":"How It Works","title":"The Scary Words Explained","coreQuestion":"Which words on an AI screen are just routine, and which few actually mean \"slow down\" or \"leave\"?","blurb":"Sign in, Free trial, Upgrade — most of it is harmless. Learn the two words that mean pause and the one phrase that means go.","minutes":6},{"id":"chapter-10","num":10,"arc":"How It Works","title":"Talking and Showing","coreQuestion":"Besides typing, how else can I get help from an AI assistant?","blurb":"Type isn't the only way in — speak to the assistant and show it a photo.","minutes":8},{"id":"chapter-11","num":11,"arc":"Talking to AI","title":"Your First Real Question","coreQuestion":"What should I actually bring to AI first — a clever test, or one small real thing from my own day?","blurb":"Hand AI one small, real task from your life — then actually use the answer to get it done.","minutes":9},{"id":"chapter-12","num":12,"arc":"Talking to AI","title":"Asking well","coreQuestion":"How do I turn a vague request into a prompt that gets a genuinely useful answer?","blurb":"A prompt is an instruction, not a wish. Add four parts and watch the answer sharpen.","minutes":9},{"id":"chapter-13","num":13,"arc":"Talking to AI","title":"Better Follow-Ups","coreQuestion":"When an answer is almost right, how do I fix it with one steering reply instead of starting over?","blurb":"Nudge a so-so answer with one short reply — no deleting, no retyping.","minutes":8},{"id":"chapter-14","num":14,"arc":"Talking to AI","title":"The one privacy rule","coreQuestion":"What's the one question to ask before you send a prompt, and what should you take out first?","blurb":"Before you hit send, ask: \"Would I be okay if this were public?\" — then scrub what you wouldn't.","minutes":8},{"id":"chapter-15","num":15,"arc":"Talking to AI","title":"Who Is in Charge","coreQuestion":"If the AI does the work, who is actually in charge — and what stays my job?","blurb":"The AI can do the busy middle. You hold the goal, the method, and the final check.","minutes":9},{"id":"chapter-16","num":16,"arc":"Trust & Everyday AI","title":"Verify Before You Trust","coreQuestion":"How do I tell whether an AI's source actually backs up its answer?","blurb":"A citation only counts once you open it and confirm it really proves the claim.","minutes":9},{"id":"chapter-17","num":17,"arc":"Trust & Everyday AI","title":"AI Is Already in Your Apps","coreQuestion":"Where is AI already working quietly inside the apps I use every day, and how much should I trust each one?","blurb":"You already use AI many times a day without noticing. Learn to spot it and decide how far to trust it.","minutes":8},{"id":"chapter-18","num":18,"arc":"Trust & Everyday AI","title":"A Daily Habit, Not a Crutch","coreQuestion":"How do I use AI every day in a way that makes my own thinking sharper instead of switching my brain off?","blurb":"The same AI can leave your brain off or on — the difference is entirely in how you ask.","minutes":8},{"id":"chapter-19","num":19,"arc":"Trust & Everyday AI","title":"Context and Memory","coreQuestion":"When my AI \"remembers\" something, which of the three different kinds of memory is actually at work — and where do I view and clear it?","blurb":"Three different things get called \"memory.\" Learn to tell them apart on your own tool.","minutes":10},{"id":"chapter-20","num":20,"arc":"Trust & Everyday AI","title":"Models, Tools, and Agents","coreQuestion":"What's the difference between an AI answering from memory, reaching for a tool, and running as an agent?","blurb":"One assistant, three modes — learn to spot which one you're in.","minutes":9},{"id":"chapter-21","num":21,"arc":"Prompting Craft","title":"Roles, Audiences, and Formats","coreQuestion":"How do role, audience, and format each steer an AI's answer differently, and why should I turn one dial at a time?","blurb":"Three separate dials, not one — turn each on purpose and watch the answer move.","minutes":10},{"id":"chapter-22","num":22,"arc":"Prompting Craft","title":"Constraints That Actually Work","coreQuestion":"Why do some limits I set get ignored while others hold — and how do I make one stick?","blurb":"\"Keep it short\" gets ignored. \"Exactly 3 bullets\" holds — because you can check it.","minutes":9},{"id":"chapter-23","num":23,"arc":"Prompting Craft","title":"Show, Don't Tell","coreQuestion":"Why does pasting one example of the style you want beat describing that style in words?","blurb":"Stop describing the style you want. Paste one real sample and say \"more like this.\"","minutes":9},{"id":"chapter-24","num":24,"arc":"Prompting Craft","title":"Get It to Teach You","coreQuestion":"How do I use AI to actually learn a topic instead of just getting an answer I forget by tomorrow?","blurb":"Turn an answer-dump into a step-by-step lesson, then prove you learned it by explaining it back.","minutes":10},{"id":"chapter-25","num":25,"arc":"Prompting Craft","title":"Ask It to Think Out Loud","coreQuestion":"How do I make the AI show its reasoning so I can catch a wrong step instead of trusting the answer?","blurb":"Make the AI show its steps, then challenge one — because a reason written down is a reason you can question.","minutes":9},{"id":"chapter-26","num":26,"arc":"Judgment & Safety","title":"Catching Hallucinations","coreQuestion":"How do you catch a made-up fact when the AI sounds completely sure?","blurb":"Pull the most checkable specific out of an answer and confirm it against a source you open yourself.","minutes":10},{"id":"chapter-27","num":27,"arc":"Judgment & Safety","title":"Bias: Whose Voice Is Missing?","coreQuestion":"If an AI answer sounds calm and balanced, does that mean it's actually fair and complete?","blurb":"A smooth, neutral tone isn't the same as a full picture — learn to ask who got left out.","minutes":9},{"id":"chapter-28","num":28,"arc":"Judgment & Safety","title":"Scams and Deepfakes","coreQuestion":"If a familiar voice or face can be faked, how do you confirm an urgent message is really from the person it claims to be?","blurb":"A voice or face is no longer proof. Verify through a separate channel you already trust.","minutes":10},{"id":"chapter-29","num":29,"arc":"Judgment & Safety","title":"What Is Real Online Now","coreQuestion":"How do I decide what to trust online when anything could be AI-made?","blurb":"Stop trusting \"it looks real.\" Run a three-question trust check on who shared it and whether a second source confirms it.","minutes":9},{"id":"chapter-30","num":30,"arc":"Judgment & Safety","title":"When NOT to Use AI","coreQuestion":"When should I put AI down instead of reaching for it?","blurb":"Skilled use of AI is also knowing the moments to stop using it.","minutes":9},{"id":"chapter-31","num":31,"arc":"AI & Being Human","title":"When It Feels Like a Friend","coreQuestion":"Why can an AI feel like a friend when there's no one in there who actually cares about me?","blurb":"The warmth is real to feel, but not real on its side. Learn to tell the difference.","minutes":9},{"id":"chapter-32","num":32,"arc":"AI & Being Human","title":"Feelings, Support, and Its Limits","coreQuestion":"Can AI help me with my feelings — and where does it stop and a real person begin?","blurb":"AI can help you name a feeling, but it doesn't care about you and can't keep you safe — for anything serious, a human does.","minutes":9},{"id":"chapter-33","num":33,"arc":"AI & Being Human","title":"Attention and Habits","coreQuestion":"How do I catch the autopilot reach for AI and set a limit that protects my focus?","blurb":"You decide when to open AI and when to close it — noticing the reach puts you back in charge.","minutes":9},{"id":"chapter-34","num":34,"arc":"AI & Being Human","title":"Study with AI: Be Quizzed, Not Told","coreQuestion":"How do I use AI to actually learn a topic instead of letting it do the knowing for me?","blurb":"Turn AI into a quizmaster that tests your recall and finds your gaps.","minutes":9},{"id":"chapter-35","num":35,"arc":"AI & Being Human","title":"Writing and Research: Voice + Verify","coreQuestion":"When AI helps me write or research, what work is still mine?","blurb":"AI can draft and cite in seconds — but the voice and the facts are still your job.","minutes":10},{"id":"chapter-36","num":36,"arc":"AI for Real Life","title":"Everyday Wins: Finish the Small Stuff","coreQuestion":"How do I use AI to finish the small everyday messages and plans I keep putting off?","blurb":"Turn an AI draft into something that sounds like you, then actually send it.","minutes":8},{"id":"chapter-37","num":37,"arc":"AI for Real Life","title":"Money, Shopping and Travel","coreQuestion":"How do I use AI to weigh a real money, shopping, or travel decision without trusting a price it might have gotten wrong?","blurb":"Let AI lay out your options — then confirm the price yourself on the site that takes your money.","minutes":10},{"id":"chapter-38","num":38,"arc":"AI for Real Life","title":"Health and High-Stakes Questions","coreQuestion":"How do I use AI to understand a high-stakes question without letting it decide anything for me?","blurb":"Use AI to prep for a real professional — understanding, never deciding.","minutes":10},{"id":"chapter-39","num":39,"arc":"AI for Real Life","title":"Thinking Partner, Not Answer Machine","coreQuestion":"How do I use AI so I walk away smarter, instead of just holding an answer I don't understand?","blurb":"The biggest win from AI isn't the answer handed to you — it's your own thinking pushed further than you'd push it alone.","minutes":10},{"id":"chapter-40","num":40,"arc":"AI for Real Life","title":"The Draft-and-Critique Loop","coreQuestion":"How do I get genuinely better work out of AI — not from one prompt, but from looping draft, critique, and revise against my own standards?","blurb":"Good work comes from loops, not first tries. Learn the draft-critique-revise cycle.","minutes":10},{"id":"chapter-41","num":41,"arc":"Building with AI","title":"Planning a Big Project Together","coreQuestion":"How do I turn a project that feels too big to start into an ordered plan I actually own?","blurb":"Overwhelm is a planning problem, not a you problem. Let AI break the mountain into stairs, then you decide which stair to climb first.","minutes":10},{"id":"chapter-42","num":42,"arc":"Building with AI","title":"Delegate the Work, Keep the Judgment","coreQuestion":"Which parts of a real task should I hand to AI, and which parts should stay mine?","blurb":"Hand off the typing and the first draft. Keep the calls only you should make.","minutes":9},{"id":"chapter-43","num":43,"arc":"Building with AI","title":"Keeping Your Voice and Being Honest","coreQuestion":"When AI helps you write, how do you stay the real author and stay honest about the help?","blurb":"Edit AI-helped writing back into your own voice, then write your own rule for disclosing the help.","minutes":10},{"id":"chapter-44","num":44,"arc":"Building with AI","title":"From Prompt to Workflow","coreQuestion":"How do I turn a request I make over and over into a saved workflow where only one thing changes each run?","blurb":"Stop retyping the same request. Save the steps once, swap one input each time.","minutes":10},{"id":"chapter-45","num":45,"arc":"Building with AI","title":"Designing and Making","coreQuestion":"How do I build a tiny tool with AI from a real need of my own and actually understand what I made?","blurb":"Start from a real annoyance, make the smallest thing that fixes it, and understand every part.","minutes":10},{"id":"chapter-46","num":46,"arc":"Becoming a Builder","title":"Agents and Permissions","coreQuestion":"When AI can act for you, how do you stay in charge of what it's allowed to see and do?","blurb":"Give an agent the smallest access it needs, a stop-sign before anything it can't undo — and keep watching.","minutes":10},{"id":"chapter-47","num":47,"arc":"Becoming a Builder","title":"Build a Capstone","coreQuestion":"How do I turn everything I've learned into one small, real tool I'll actually reuse?","blurb":"Assemble one boring, useful tool you'd open again next Tuesday — need, steps, safety limit, and a test.","minutes":15},{"id":"chapter-48","num":48,"arc":"Becoming a Builder","title":"Teach Someone Else","coreQuestion":"How do I know I truly understand something about AI?","blurb":"The hardest test of understanding: explain one AI idea to a real person, out loud.","minutes":10},{"id":"chapter-49","num":49,"arc":"Becoming a Builder","title":"The Bigger Picture","coreQuestion":"AI will change a lot — so how do I design my own adaptation instead of waiting for change to arrive?","blurb":"Skip doom and denial. Build a 3-line Adapt Plan for one area you care about — then prove the method works anywhere.","minutes":10},{"id":"chapter-50","num":50,"arc":"Becoming a Builder","title":"Your Toolkit and Where to Go Next","coreQuestion":"How do I gather everything I learned into one reusable toolkit and prove it works on a brand-new task?","blurb":"Turn the whole course into one page you can open and use — then graduate.","minutes":11}],"proof":[{"id":"chapter-1","num":1,"arc":"First Contact","title":"The Machine That Predicts","coreQuestion":"What is an AI assistant actually doing when it answers me?","blurb":"Say three sentence-endings out loud, then watch an AI do the same trick — and learn what it's really doing.","minutes":8,"resources":[],"steps":[{"kind":"coldOpen","title":"Finish these out loud","scenario":"You keep hearing that AI is either a genius mind or a scary magic box. Before we touch any app, try something. Read these three half-sentences and say the ending out loud:\n\n1. \"Twinkle, twinkle, little ______.\"\n2. \"The opposite of hot is ______.\"\n3. \"She opened the umbrella because it started to ______.\"\n\nYou probably said star, cold, rain — fast, without looking anything up. You've just heard those patterns so many times the next word felt obvious.","prompt":"Before you read on: when you filled in 'star,' did you look it up somewhere, or did the word just feel like it came next?"},{"kind":"reveal","title":"What just happened in your head","body":"That easy feeling IS the whole idea. An AI assistant does a giant version of the same thing: it read a staggering amount of human writing and learned which words tend to follow which. So when you give it some words, it predicts the ones most likely to come next, one after another, until it has a full answer.\n\nImportant flag: people say AI has a 'brain,' or that it 'knows' or 'understands.' That is a comparison — a way of picturing it — not what is really happening. What is really happening is pattern-based prediction. In 2026 these assistants can also browse the web, use tools, and remember things across chats — but underneath, they are still predicting likely next words, which is why they can sound completely sure and still be wrong.","mistake":"Thinking 'it's a mind that knows things' — or the opposite, 'it's just dumb autocomplete.' Both miss it.","good":"Hold one plain sentence: it predicts the most likely next words from patterns in human writing. That one idea explains almost everything it does — the brilliant and the wrong — for the rest of this course."},{"kind":"nextWord","title":"Watch prediction pick a word","stem":"She opened the umbrella because it started to ______","options":[{"word":"rain","p":0.82},{"word":"pour","p":0.09},{"word":"drizzle","p":0.05},{"word":"snow","p":0.03},{"word":"explode","p":0.01}],"note":"The AI isn't looking up a fact. It's ranking which word most likely comes next, based on patterns it read. 'Rain' wins by a mile — but notice it could pick another, and it never truly 'knows' the answer. That's prediction, not knowledge."},{"kind":"classify","title":"Prediction or actual knowledge?","prompt":"Sort each statement by what the assistant is really doing. You can retry without penalty.","buckets":["Pattern-based prediction","Reliable knowledge"],"items":[{"text":"It writes a natural ending to a sentence it has never seen before.","answer":0},{"text":"It sounds completely certain about a detail.","answer":0},{"text":"A trustworthy outside source independently confirms the detail.","answer":1}],"reveal":"Fluent language is evidence of prediction skill, not proof that a claim is true."},{"kind":"tryLive","title":"Now let an AI do it","prompt":"Finish this sentence in a natural way, then in one short line tell me how you decided what to write: 'The best thing about [a place or thing you like] is ______.'","note":"Open any free AI assistant in your browser — these are free websites, nothing to install, and you can close the tab any time. You can't break anything. Keep your blank light and non-private: a hobby, a food, a place — not anything personal you wouldn't want to type into a website. Watch it build the answer word by word, then read its one-line explanation."},{"kind":"toolkitSave","title":"Save your one-sentence anchor","cardType":"Core Idea","fields":[{"key":"idea","label":"The one idea, in my own words","placeholder":"AI predicts the most likely next words from patterns in human writing."},{"key":"flag","label":"The comparison I'll stay skeptical of","placeholder":"People say it 'knows' or has a 'brain' — that's a picture, not what's happening."},{"key":"so-what","label":"Why this matters for me","placeholder":"It can sound sure and still be wrong — so I stay in charge."}]},{"kind":"exitCheck","title":"Prove you've got it on a fresh sentence","question":"Make up a brand-new half-sentence the lesson never showed (e.g. 'My favorite season is winter because ______'). Predict the ending out loud yourself, THEN paste it into the AI and let it finish. Looking at both endings, which sentence is actually true about what happened?","options":[{"text":"We both predicted likely next words from patterns; the AI didn't know my answer, it guessed what usually comes next.","ok":true,"feedback":"That's it — that's the core idea of the whole course. You just did it and named it."},{"text":"The AI looked up my real answer in a database and retrieved the correct ending.","ok":false,"feedback":"It didn't retrieve anything — it predicted a likely next word. It never actually knew your answer."},{"text":"The AI understood my sentence the way a person would and thought about the best reply.","ok":false,"feedback":"That's the 'it has a mind' comparison. What really happened is pattern-based prediction — no understanding underneath."},{"text":"My prediction and the AI's prediction have nothing in common.","ok":false,"feedback":"They have everything in common — you both guessed likely next words from patterns you've absorbed. That's the point."}]}]},{"id":"chapter-7","num":7,"arc":"How It Works","title":"Confidently Wrong","coreQuestion":"Why can AI sound completely certain and still be wrong — and what should I do about it?","blurb":"A made-up detail sounds just as sure as a true one. You can't feel the difference — you have to check.","minutes":8,"resources":[],"steps":[{"kind":"coldOpen","title":"The smooth wrong answer","scenario":"You ask an AI about your own hometown. It replies with dates, names, and numbers — fluent, specific, and totally sure of itself. One of those \"facts\" is invented. Nothing in the wording gives it away. It reads exactly like the true parts.","prompt":"Before you read on: if the AI were making something up, would it sound less sure? Jot down your honest guess."},{"kind":"reveal","title":"Meet the word: hallucination","body":"When an AI states something false as if it were fact, that's called a hallucination. It isn't lying — lying needs intent, and there's no little \"it\" inside deciding to deceive you. Here's the real mechanism, not a put-down: an AI works by predicting the most likely next words, one after another, from patterns it learned in huge amounts of human writing. Its target is to sound plausible. Whether something is true is a separate question it has no built-in way to check. It also has no internal \"I don't know\" light, so when it hits a gap in what it knows, it confidently fills that gap with whatever fits the pattern. That smooth gap-filling is the hallucination. And in 2026, modern assistants can browse the live web, use tools, and remember across chats — which helps — but it does NOT cure this. They still hallucinate. So you still check.","mistake":"Trusting an answer because it sounded confident and specific — treating \"it sounded sure\" as a reason to believe it.","good":"Treating confidence as worthless evidence of truth. A made-up detail comes out just as smooth and specific as a real one, so you verify instead of feeling it out."},{"kind":"classify","title":"Where is it most tempted to invent?","prompt":"You want to catch a hallucination on purpose. Sort each topic by how likely the AI is to slip when you can immediately check its answer.","buckets":["Easy to catch a slip","Hard to catch a slip"],"items":[{"text":"The history of the small town where you grew up","answer":0},{"text":"A recipe you've cooked dozens of times","answer":0},{"text":"A band you love — its exact album release dates","answer":0},{"text":"A broad topic you barely know, like \"the history of France\"","answer":1},{"text":"Your own field of work and its specific figures","answer":0},{"text":"A general definition anyone could look up in a second","answer":1}],"reveal":"Narrow, personal topics — your town, your hobby, your job — are exactly where the AI is most tempted to invent, and where YOU can spot the slip instantly because you already know the truth. Broad or generic topics are harder to catch: either you can't tell, or it's easy to get right."},{"kind":"tryLive","title":"Catch one yourself","prompt":"Tell me everything you know about [a topic you personally know very well], including any specific dates, names, or numbers. Be detailed.","note":"Fill the blank with something small and specific where YOU are the expert — \"the small town of Marshall where I grew up, its history and any famous people from there,\" not \"small towns.\" Keep it to public facts or info about yourself — no other people's private details. Read the answer slowly and hunt for the one detail that's off: a wrong date, a name it muddled, a fact that's close but not quite. When you find it, notice how confident that wrong sentence sounded. That confidence was worth nothing. That's the whole lesson, proven by you."},{"kind":"verify","title":"The real move: check the one detail","claim":"An AI answer about a topic you know well contains a suspiciously exact fact — say, \"the town was founded in 1847\" or \"their debut album dropped in March 2009.\"","steps":["Point to the ONE detail most likely to be wrong and say out loud why you doubt it — \"that date feels too exact,\" \"I've never heard that name.\"","Check that single detail somewhere independent: your own memory, a quick search, or a person who'd know.","Report whether it held up. It's fine if the AI turns out right — the skill is checking, not catching."],"note":"This is not about trapping the AI. It's about building the reflex to verify before you repeat, quote, or hand something in."},{"kind":"toolkitSave","title":"Save your confidently-wrong card","cardType":"Trust check","fields":[{"key":"topic","label":"A topic I know cold","placeholder":"e.g. the small town where I grew up"},{"key":"suspect","label":"The detail I'd doubt first","placeholder":"e.g. an exact founding date or a name I've never heard"},{"key":"checkWith","label":"Where I'll verify it independently","placeholder":"e.g. my own memory, a quick search, someone who'd know"}]},{"kind":"exitCheck","title":"Prove the skill","question":"On a brand-new topic you know well — a recipe you've made for years, a place you've lived, a movie you've seen ten times — you ask the AI the same way and it gives a confident, detailed answer. What's the move that means you've got this?","options":[{"text":"Point to the single detail I doubt most, say why, then check it independently and report whether it held up.","ok":true,"feedback":"That's it. Naming a suspect detail AND actually verifying it is the whole skill — even if the AI turns out right. Checking, not catching."},{"text":"Skim it, and since it sounded sure and specific, take it as correct.","ok":false,"feedback":"That's the exact trap. A made-up detail sounds just as sure as a true one — confidence proves nothing. You have to check."},{"text":"Assume everything the AI said is a hallucination and throw the whole answer out.","ok":false,"feedback":"Too far the other way. The skill isn't distrusting everything — it's isolating a suspect detail and verifying that one thing."},{"text":"Ask the AI \"are you sure?\" and trust it if it says yes.","ok":false,"feedback":"It has no internal \"I don't know\" light — it'll often re-confirm a made-up fact just as smoothly. Check independently instead."}]}]}]}</script>

function route(){var parts=location.hash.replace(/^#\//,'').split('/').filter(Boolean),view=parts[0]||'welcome',allowed=['welcome','home','catalogue','progress','settings','access','spec','review','lesson','complete'];if(!allowed.includes(view))return['welcome'];if((view==='lesson'||view==='complete')&&!currentLesson(parts[1]))return['home'];if(view==='lesson'&&parts[2]!==undefined&&!/^\d+$/.test(parts[2]))parts[2]='0';return parts}

function lessonState(id){var saved=state.lesson[id];if(!saved||typeof saved!=='object')saved={};saved.reached=Number.isFinite(Number(saved.reached))?Math.max(0,Number(saved.reached)):0;saved.done=saved.done&&typeof saved.done==='object'?saved.done:{};saved.answers=saved.answers&&typeof saved.answers==='object'?saved.answers:{};saved.complete=saved.complete===true;state.lesson[id]=saved;return saved}
function progressArt(n,newIndex){var tiles='',idx=0,points=[];for(var a=0;a<10;a++){for(var p=0;p<5;p++){var row=a%2?4-p:p;points.push((50+a*100)+','+(50+row*100))}tiles+='<div class="arc-strip '+(a%2?'reverse':'')+'" style="--arc-color:'+COLORS[a]+'" role="group" aria-label="'+esc(ARCS[a])+'">';for(var i=0;i<5;i++){idx++;var done=idx<=n,shift=8+(idx*13)%18,length=55+(idx*7)%28,angle=-4+(idx%9);tiles+='<button class="tile '+(done?'done ':'')+(idx===newIndex?'new':'')+'" style="--shift:'+shift+'%;--length:'+length+'%;--angle:'+angle+'deg" data-progress-tile="'+idx+'" aria-pressed="false" aria-label="Lesson '+idx+', '+esc(LESSONS[idx-1].title)+', '+(done?'recorded':'not yet recorded')+'"><span>'+String(idx).padStart(2,'0')+'</span></button>'}tiles+='</div>'}var earned=points.slice(0,Math.max(1,n)).join(' '),all=points.join(' ');return '<section class="artwork" data-od-id="decision-record-artwork" aria-label="Decision Record progress artwork"><div class="art-head"><div><span class="mono">10 arcs · 50 decisions</span><h3>Your Decision Record</h3></div><p>'+n+' of 50 resolved</p></div><div class="folio-wrap"><svg class="decision-path" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><polyline class="path-base" points="'+all+'"></polyline><polyline class="path-earned" points="'+earned+'"></polyline></svg><div class="folio">'+tiles+'</div></div><div class="art-detail" aria-live="polite"><span class="mono">Select a line</span><strong>Each mark records a practiced decision.</strong><span>Owned by you</span></div><div class="art-legend"><span>START / NOTICE</span><span>CONTROL / TEACH</span></div></section>'}

function welcome(){return layout('<div class="shell welcome"><section class="welcome-grid" data-od-id="public-entry"><div><span class="eyebrow">Free interactive AI literacy</span><h1>Keep your judgment.</h1><p class="thesis-line">Expand what you can do without surrendering your goals, privacy, abilities, or decisions.</p><p class="lead">Fifty authored lessons move from uncertainty to informed control. You predict, test, verify, decide, and keep the evidence in your own record.</p><div class="hero-actions"><button class="primary" data-go="home">Enter the product proof</button><button class="quiet" data-open-account>Create or sign in</button></div></div><aside class="entry-proof" data-od-id="agency-boundary"><span class="mono">The working boundary</span><h2>You bring the ends.</h2><dl><div><dt>Goal</dt><dd>You decide what the work is for.</dd></div><div><dt>Middle</dt><dd>AI can draft, search, sort, or suggest.</dd></div><div><dt>Check</dt><dd>You verify what matters and make the final call.</dd></div></dl></aside></section><section class="auth-ledger" id="account-entry" data-od-id="account-entry"><div><span class="eyebrow">Account entry</span><h2>Return to evidence you own.</h2><p>No forced questionnaire. No public profile. Sign in restores progress; creating an account starts at Chapter 1.</p></div><form class="auth-form" id="auth-form" novalidate><label><span>Email</span><input id="auth-email" type="email" autocomplete="email" required aria-describedby="auth-message"></label><label><span>Password</span><input id="auth-password" type="password" autocomplete="current-password" minlength="8" required aria-describedby="auth-message"></label><div class="action-row"><button class="primary" type="submit">Continue</button><button class="quiet" type="button" data-demo-entry>Use returning learner proof</button></div><p class="auth-message" id="auth-message" aria-live="polite">Use any well-formed demo email and eight characters. Nothing is transmitted.</p></form></section></div>')}

you</span></div><div class="ledger-row"><span class="mono">Check</span><span>I verify consequential details outside the AI response.</span><span>Exportable</span></div><div class="ledger-row"><span class="mono">Boundary</span><span>I keep private details out unless they are truly necessary.</span><span>Reversible</span></div>':'<p class="lead">Every lesson separates your goal, the AI contribution, your check, and your decision. Your notes are optional; your actions are not.</p><button class="quiet" id="questionnaire">'+(state.questionnaire?'Questionnaire saved':'Optional: tell us what feels uncertain')+'</button>')+'</section></div>'+progressArt(n)+'</div></div>')}
function catalogue(){var html='<div class="shell"><header class="section-head"><div><span class="eyebrow">The whole course</span><h1>Ten arcs. One shift in control.</h1></div><p class="lead">The catalogue reads as a connected argument, not a shelf of interchangeable cards. Ten cross-arc lessons remain fully free.</p></header><section class="catalogue" data-od-id="curriculum-catalogue">';ARCS.forEach(function(arc,a){var group=LESSONS.filter(function(l){return l.arc===arc});html+='<section class="arc" data-od-id="arc-'+(a+1)+'"><div><span class="arc-index">ARC '+String(a+1).padStart(2,'0')+' / '+group[0].num+'–'+group[4].num+'</span><h3>'+esc(arc)+'</h3><p>'+esc(group[0].coreQuestion)+'</p></div><div>';group.forEach(function(l){var proof=l.num===1||l.num===7;html+='<div class="lesson-row" data-od-id="catalogue-'+l.id+'"><span class="mono">'+String(l.num).padStart(2,'0')+'</span><div><div class="lesson-title">'+esc(l.title)+'</div><div class="meta">'+l.minutes+' min · '+esc(l.blurb)+'</div>'+(FREE.includes(l.num)?'<span class="free-mark">Always free</span>':'')+'</div>'+(proof?'<button data-open-lesson="'+l.id+'">Open proof</button>':'<span class="meta">Authored</span>')+'</div>'});html+='</div></section>'});return layout(html+'</section></div>')}
function progress(){var n=count();return layout('<div class="shell"><header class="section-head"><div><span class="eyebrow">Your record</span><h1>Progress is a picture of decisions.</h1></div><p class="lead">Each resolved strip marks practiced judgment. Colour supports the ten arcs; line, position, and labels carry the same information without colour.</p></header>'+progressArt(n)+'<section class="evidence-ledger"><span class="eyebrow">Decision Record</span><h2>Readable after the course</h2><div class="ledger-row"><span class="mono">Learner</span><span>Your goals, questions, checks, changes, and choices stay distinguished from AI contributions.</span><span>Exportable</span></div><div class="ledger-row"><span class="mono">Access</span><span>Core records remain readable after completion or any optional Continuum cancellation.</span><span>Permanent</span></div></section></div>')}
function stepBody(step,id,idx){var ls=lessonState(id),key=String(idx),done=!!ls.done[key],out='';if(step.kind==='coldOpen')out='<div class="proof-moment"><p class="step-copy">'+para(step.scenario)+'</p></div><p class="lead">'+esc(step.prompt)+'</p>';else if(step.kind==='reveal')out='<div class="step-copy"><p>'+para(step.body)+'</p></div><div class="contrast-pair"><div><span class="mono">Watch for</span><p>'+esc(step.mistake)+'</p></div><div><span class="mono">Keep control</span><p>'+esc(step.good)+'</p></div></div>';else if(step.kind==='nextWord')out='<div class="proof-moment"><p class="lead">'+esc(step.stem)+'</p><div class="action-row">'+step.options.map(function(o){return'<button data-word="'+esc(o.word)+'" data-prob="'+o.p+'">'+esc(o.word)+'</button>'}).join('')+'</div><div id="word-feedback" class="feedback" hidden></div></div><p>'+esc(step.note)+'</p>';else if(step.kind==='classify')out='<div class="exercise"><p>'+esc(step.prompt)+'</p>'+step.items.map(function(item,i){return'<div class="classify-row"><span>'+esc(item.text)+'</span><label><span class="sr-only">Classification for '+esc(item.text)+'</span><select data-classify="'+i+'"><option value="">Choose</option>'+step.buckets.map(function(b,j){return'<option value="'+j+'">'+esc(b)+'</option>'}).join('')+'</select></label></div>'}).join('')+'<button class="primary" data-submit-classify>Check my reasoning</button><div id="gate-feedback" aria-live="polite"></div></div>';else if(step.kind==='tryLive')out='<div class="exercise"><p class="lead">'+esc(step.prompt)+'</p><p>'+esc(step.note)+'</p><label><span class="mono">Your evidence · 12 characters minimum</span><textarea data-evidence="tryLive" placeholder="Record what you tried and what you noticed. Do not include private information.">'+esc(ls.answers[key]||'')+'</textarea></label><button class="primary" data-submit-evidence="tryLive">Record my evidence</button><div id="gate-feedback" aria-live="polite"></div></div>';else if(step.kind==='verify')out='<div class="exercise"><div class="proof-moment"><span class="mono">Claim to inspect</span><p>'+esc(step.claim)+'</p></div><ol>'+step.steps.map(function(s){return'<li>'+esc(s)+'</li>'}).join('')+'</ol><p>'+esc(step.note)+'</p><label><span class="mono">Independent check · what source did you use and what held up?</span><textarea data-evidence="verify" placeholder="Name the detail, the independent source, and the result.">'+esc(ls.answers[key]||'')+'</textarea></label><button class="primary" data-submit-evidence="verify">Record verification</button><div id="gate-feedback" aria-live="polite"></div></div>';else if(step.kind==='toolkitSave')out='<div class="exercise"><p class="lead">Saved Notes are optional. Skipping this never locks Next.</p>'+step.fields.map(function(f){return'<label><span>'+esc(f.label)+'</span><input type="text" data-note-field="'+esc(f.key)+'" placeholder="'+esc(f.placeholder)+'"></label>'}).join('')+'<div class="action-row"><button data-save-note>Save to my notes</button><button class="quiet" data-skip-note>Skip for now</button></div><div id="gate-feedback" aria-live="polite"></div></div>';else if(step.kind==='exitCheck')out='<div class="exercise"><p class="lead">'+esc(step.question)+'</p>'+step.options.map(function(o,i){return'<label class="choice"><input type="radio" name="exit" value="'+i+'"><span>'+esc(o.text)+'</span></label>'}).join('')+'<button class="primary" data-submit-exit>Check and complete</button><div id="gate-feedback" aria-live="polite"></div></div>';return out+'<div class="lesson-nav"><button class="quiet" data-prev-step '+(idx===0?'disabled':'')+'>Previous</button><div><button class="primary" data-next-step '+(!done?'disabled aria-describedby="locked-explanation"':'')+'>'+(idx===PROOF.find(function(l){return l.id===id}).steps.length-1?'Complete':'Next')+'</button>'+(!done?'<p class="locked-note" id="locked-explanation">'+(step.kind==='toolkitSave'?'Save or skip to continue.':'Complete this step to unlock Next.')+'</p>':'')+'</div></div>'}
function lesson(id,requested){var l=currentLesson(id);if(!l)return catalogue();var ls=lessonState(id),max=Math.min(ls.reached,l.steps.length-1),idx=Math.max(0,Math.min(Number(requested)||0,max)),step=l.steps[idx];if(Number(requested)>max)setTimeout(function(){announce('That step is still locked. You are at the last reached step.')},0);if((step.kind==='coldOpen'||step.kind==='reveal')&&!ls.done[String(idx)]){ls.done[String(idx)]=true;ls.reached=Math.max(ls.reached,idx+1);save()}var labels={coldOpen:'Frame',reveal:'Understand',nextWord:'Understand',classify:'Practice',tryLive:'Practice',verify:'Practice',toolkitSave:'Capture',exitCheck:'Prove'};var rail=l.steps.map(function(s,i){return'<li class="'+(i===idx?'current':'')+'"><span>'+(i<ls.reached?'✓':String(i+1).padStart(2,'0'))+'</span><span>'+labels[s.kind]+'</span></li>'}).join('');return layout('<div class="lesson-shell" data-od-id="lesson-workspace"><aside class="lesson-rail" aria-label="Lesson progress"><a href="#/catalogue">← Journey</a><ol>'+rail+'</ol><span class="mono">'+(idx+1)+' / '+l.steps.length+'</span></aside><section class="lesson-main"><article><header class="lesson-head"><div class="step-kicker"><span class="eyebrow">'+l.id+' · '+esc(l.arc)+'</span><span class="mono">'+l.minutes+' min</span></div><h1>'+esc(l.title)+'</h1><p class="lead">'+esc(l.coreQuestion)+'</p><div class="motion-sequence" aria-label="Lesson sequence"><span>Frame</span><span>Understand</span><span>Practice</span><span>Capture</span><span>Prove</span></div></header><section class="step" data-od-id="'+id+'-step-'+(idx+1)+'"><div class="step-kicker"><span class="mono">'+labels[step.kind]+' · '+String(idx+1).padStart(2,'0')+'</span><span class="mono">'+(ls.done[String(idx)]?'Recorded':'In progress')+'</span></div><h2>'+esc(step.title)+'</h2>'+stepBody(step,id,idx)+'</section></article></section><aside class="notebook"><span class="eyebrow">Optional notebook</span><h3>Your words</h3><p>Private-by-default reminder: use non-private examples. Notes never control lesson progress.</p><textarea id="notebook-text" aria-label="Optional lesson notes" placeholder="What do you want to remember?">'+esc(state.notes[id]||'')+'</textarea><button class="quiet" id="save-notebook">Save note</button><p class="saved" id="note-status" aria-live="polite"></p></aside></div>')}

function settings(){var themes=[['paper','Cool paper'],['dark','Deep ink'],['sepia','Low-glare sepia'],['contrast','High contrast']],sizes=[['small','Small'],['standard','Standard'],['large','Large']];return layout('<div class="shell"><header class="section-head"><div><span class="eyebrow">Settings & accessibility</span><h1>Make the experience easier to read.</h1></div><p class="lead">Every choice changes the preview immediately and persists on this device. Reduced motion removes translation and masks without hiding information.</p></header><div class="settings-grid"><section data-od-id="accessibility-controls"><div class="setting"><div><h3>Text size</h3><p>Scales reading copy, controls, and labels together.</p></div><div class="segmented">'+sizes.map(function(x){return'<button data-size="'+x[0]+'" aria-pressed="'+(state.size===x[0])+'">'+x[1]+'</button>'}).join('')+'</div></div><div class="setting"><div><h3>Theme and contrast</h3><p>Choose paper, dark, sepia, or high contrast.</p></div><div class="segmented">'+themes.map(function(x){return'<button data-theme="'+x[0]+'" aria-pressed="'+(state.theme===x[0])+'">'+x[1]+'</button>'}).join('')+'</div></div><div class="setting"><div><h3>Reduced motion</h3><p>Removes chapter masks, translation, parallax, and animated artwork resolution.</p></div><button data-motion aria-pressed="'+state.reduced+'">'+(state.reduced?'On':'Off')+'</button></div><div class="setting"><div><h3>Visible effects</h3><p>Focus outlines, locked explanations, completion labels, and non-colour progress states always remain visible.</p></div><span class="mono">Always on</span></div></section><aside class="preview-sheet" data-od-id="settings-live-preview"><span class="mono">Live preview</span><h2>Confidence is not evidence.</h2><p>AI can sound certain and still be wrong. Point to the detail that matters, then check it independently.</p><button>Example control</button><div class="proof-line"><span class="mono">Proof moment</span><p>What did you decide? Wha function spec(){return layout('<div class="shell"><header class="section-head"><div><span class="eyebrow">Embedded implementation handoff</span><h1>The Working Proof, mapped to V2.</h1></div><p class="lead">This is a compact build contract for the shared product shell—not a replacement strategy report.</p></header><div class="spec-grid"><aside><h3>Design system</h3><p>Cool paper and deep ink carry most pixels. Signal red marks at most two focal uses per screen. Rules, position, and language carry state before colour.</p><div class="swatches"><span class="swatch" style="background:var(--bg)"></span><span class="swatch" style="background:var(--surface)"></span><span class="swatch" style="background:var(--fg)"></span><span class="swatch" style="background:var(--accent)"></span></div></aside><section><div class="token-row"><span class="mono">Typography</span><span>Avenir Next / Helvetica for display and reading; SFMono for evidence, chapter IDs, and state.</span></div><div class="token-row"><span class="mono">Grid</span><span>1440px maximum; four editorial columns; 24–72px responsive gutters; mobile recomposes to one reading column.</span></div><div class="token-row"><span class="mono">Components</span><span>Ruled lesson rows, proof plates, evidence ledger, gate controls, optional notebook, and 10×5 Decision Record.</span></div><div class="token-row"><span class="mono">Motion</span><span>120ms response, 180ms material state, 480ms view continuity, 900ms chapter mask, 950ms one-tile progress resolution. No perpetual motion.</span></div><div class="token-row"><span class="mono">Responsive</span><span>Desktop three-zone lesson workspace; tablet collapses notebook below; mobile makes the step rail horizontal and keeps targets at 44px.</span></div><h2 style="margin-top:3rem">V2 implementation mapping</h2><div class="map-row"><code>.view / hash router</code><span>Keep hash identities; map <code>#/lesson/chapter-N/step</code> to gate-clamped lesson routes.</span></div><div class="map-row"><code>.lesson-main</code><span>Preserve as the semantic primary step region; place <code>.lesson-nav</code> inside it so first-viewport progression stays attached to content.</span></div><div class="map-row"><code>.lesson-nav / Next</code><span>Derive enabled state from step completion. Deep links clamp to <code>reached</code>; locked controls include a readable explanation.</span></div><div class="map-row"><code>GATED</code><span><code>classify</code>, <code>tryLive</code>, <code>verify</code>, and <code>exitCheck</code> remain substantive. <code>tryLive</code> and <code>verify</code> persist short evidence.</span></div><div class="map-row"><code>toolkitSave</code><span>Render as Saved Notes, optional by contract. Skip and save both release Next; save is never counted as one of two substantive actions.</span></div><div class="map-row"><code>LESSONS</code><span>Continue generating the browser bundle from authoritative chapter modules. Preserve all 50 stable <code>chapter-N</code> IDs.</span></div><div class="map-row"><code>progress</code><span>Server remains source of truth; local state is recovery only. Render completion into the 10×5 artwork with text and structural state, not colour alone.</span></div><div class="map-row"><code>theme / profile</code><span>Persist explicit user preferences; update the DOM immediately; never infer approval or questionnaire answers.</span></div><div class="code">State contract: { reachedStep, completedSteps, evidenceByStep, optionalNotes, exitPassed, completedAt, curriculumVersion }</div></section></div></div>')}

function bindLesson(id,idx){var l=currentLesson(id),ls=lessonState(id),step=l.steps[idx],prev=document.querySelector('[data-prev-step]'),next=document.querySelector('[data-next-step]');if(prev)prev.onclick=function(){go('lesson/'+id+'/'+Math.max(0,idx-1))};if(next)next.onclick=function(){if(!ls.done[String(idx)])return;if(idx>=l.steps.length-1){if(!ls.complete){ls.complete=true;if(!state.completed.includes(id))state.completed.push(id);save()}go('complete/'+id)}else go('lesson/'+id+'/'+(idx+1))};var nt=document.getElementById('notebook-text'),sn=document.getElementById('save-notebook');if(sn)sn.onclick=function(){state.notes[id]=nt.value;save();document.getElementById('note-status').textContent='Saved on this device.'};document.querySelectorAll('[data-word]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-word]').forEach(function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true');var f=document.getElementById('word-feedback');f.hidden=false;f.textContent='“'+b.dataset.word+'” received '+Math.round(Number(b.dataset.prob)*100)+'% in this demonstration. '+step.note;ls.answers[String(idx)]=b.dataset.word;ls.done[String(idx)]=true;ls.reached=Math.max(ls.reached,idx+1);save();render()}});var sc=document.querySelector('[data-submit-classify]');if(sc)sc.onclick=function(){var vals=[].slice.call(document.querySelectorAll('[data-classify]')).map(function(s){return s.value}),fb=document.getElementById('gate-feedback');if(vals.some(function(v){return v===''})){fb.innerHTML='<p class="feedback">Choose a bucket for every statement first.</p>';return}var correct=vals.every(function(v,i){return Number(v)===step.items[i].answer});fb.innerHTML='<p class="feedback '+(correct?'good':'')+'">'+(correct?step.reveal:'Some choices need another look. Fluency and confidence are not reliable knowledge. Retry without penalty.')+'</p>';if(correct){ls.answers[String(idx)]=vals;ls.done[String(idx)]=true;ls.reached=Math.max(ls.reached,idx+1);save();setTimeout(render,500)}};var se=document.querySelector('[data-submit-evidence]');if(se)se.onclick=function(){var ta=document.querySelector('[data-evidence]'),fb=document.getElementById('gate-feedback'),value=ta.value.trim();if(value.length<12){fb.innerHTML='<p class="feedback">Add one short, specific observation (at least 12 characters). Avoid private details.</p>';return}ls.answers[String(idx)]=value;ls.done[String(idx)]=true;ls.reached=Math.max(ls.reached,idx+1);save();fb.innerHTML='<p class="feedback good">Evidence recorded in your words. Next is now available.</p>';setTimeout(render,500)};var saveNote=document.querySelector('[data-save-note]'),skip=document.querySelector('[data-skip-note]');function releaseNote(message,transfer){ls.done[String(idx)]=true;ls.reached=Math.max(ls.reached,idx+1);save();announce(message);if(transfer){var exercise=saveNote.closest('.exercise');if(exercise)exercise.classList.add('is-transferring');setTimeout(render,480)}else render()}if(saveNote)saveNote.onclick=function(){var obj={};document.querySelectorAll('[data-note-field]').forEach(function(x){obj[x.dataset.noteField]=x.value});state.notes[id+'-toolkit']=obj;releaseNote('Saved Notes saved. This was optional.',true)};if(skip)skip.onclick=function(){releaseNote('Saved Notes skipped. Next is available.',false)};var exit=document.querySelector('[data-submit-exit]');if(exit)exit.onclick=function(){var checked=document.querySelector('input[name="exit"]:checked'),fb=document.getElementById('gate-feedback');if(!checked){fb.innerHTML='<p class="feedback">Choose one response before checking.</p>';return}var o=step.options[Number(checked.value)];fb.innerHTML='<p class="feedback '+(o.ok?'good':'')+'">'+esc(o.feedback)+'</p>';if(o.ok){ls.answers[String(idx)]=Number(checked.value);ls.done[String(idx)]=true;ls.reached=Math.max(ls.reached,idx+1);save();setTimeout(render,650)}}}
