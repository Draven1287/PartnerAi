<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  .lp {
    --bw: 1px;
    min-height: 100vh;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .lp[data-theme="light"]    { --bg:#f6f3ea; --surface:#fffdf8; --surface-2:#efe8d8; --border:#e4dcc9; --text:#211f1a; --text-dim:#5d5749; --text-faint:#8c8573; --accent:#3a3aa3; --accent-dim:#2c2c84; --accent-soft:rgba(58,58,163,.10); --good:#1f8a5b; --bad:#c2414b; --on-accent:#fff; --shadow:rgba(40,33,20,.08); }
  .lp[data-theme="dark"]     { --bg:#16140f; --surface:#211e18; --surface-2:#2b271f; --border:#3a352b; --text:#f3efe6; --text-dim:#b3ab9a; --text-faint:#857e6e; --accent:#a6a4f2; --accent-dim:#bcbaf6; --accent-soft:rgba(166,164,242,.16); --good:#4cc38a; --bad:#f0808a; --on-accent:#16140f; --shadow:rgba(0,0,0,.45); }
  .lp[data-theme="sepia"]    { --bg:#efe2c8; --surface:#f8efd8; --surface-2:#e6d6b6; --border:#d3c09a; --text:#3f3320; --text-dim:#6e5d3e; --text-faint:#9a8861; --accent:#8a5a23; --accent-dim:#6f4719; --accent-soft:rgba(138,90,35,.13); --good:#5a7d3a; --bad:#b5462f; --on-accent:#fff; --shadow:rgba(80,55,20,.13); }
  .lp[data-theme="contrast"] { --bw:2px; --bg:#000; --surface:#0c0c0c; --surface-2:#1a1a1a; --border:#ffffff; --text:#ffffff; --text-dim:#ededed; --text-faint:#c4c4c4; --accent:#8fb0ff; --accent-dim:#b3c8ff; --accent-soft:rgba(143,176,255,.22); --good:#3ff08f; --bad:#ff7b85; --on-accent:#000; --shadow:rgba(0,0,0,.6); }

  .lp-canvas { max-width: 1140px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- top nav ---------- */
  .topnav { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--bg) 84%, transparent); border-bottom: var(--bw) solid var(--border); }
  .topnav-in { max-width: 1140px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; font-size: 16px; }
  .brand .spark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(150deg, #f4b66a, #d98a6a); color: #2b2350; }
  .brand b { color: var(--accent); }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tab { border: 0; background: transparent; color: var(--text-dim); font: inherit; font-size: 14px; font-weight: 600; padding: 8px 13px; border-radius: 9px; cursor: pointer; transition: all .15s; }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.on { color: var(--accent); background: var(--accent-soft); }
  .nav-spacer { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 8px; }
  .ctrl > label { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }
  .seg { display: inline-flex; background: var(--surface-2); border: var(--bw) solid var(--border); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--text-dim); font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer; transition: all .15s; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px var(--shadow); }
  .lp[data-theme="contrast"] .seg button.on { background: var(--accent); color: var(--on-accent); }
  .linkbtn { border: 0; background: transparent; color: var(--text-faint); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .linkbtn:hover { color: var(--text); background: var(--surface-2); }

  /* ---------- shared ---------- */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 12px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; border: var(--bw) solid transparent; transition: all .15s; text-decoration: none; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--text-dim); background: var(--surface); }
  .btn-locked { background: var(--surface-2); color: var(--text-faint); border: var(--bw) dashed var(--border); cursor: not-allowed; }
  .btn.pop { animation: unlockpop .5s cubic-bezier(.2,1.3,.4,1); }
  @keyframes unlockpop { 0%{ transform:scale(.92);} 55%{ transform:scale(1.07);} 100%{ transform:scale(1);} }
  .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }
  .serif { font-family: "Newsreader", Georgia, serif; font-weight: 500; letter-spacing: -.015em; }

  /* ---------- onboarding ---------- */
  .onb { max-width: 600px; margin: 0 auto; padding: 48px 0 8px; }
  .onb.wide { max-width: 720px; }
  .onb-card { background: var(--surface); border: var(--bw) solid var(--border); border-radius: 22px; box-shadow: 0 22px 60px var(--shadow); padding: 36px 40px; }
  @media (max-width:560px){ .onb-card { padding: 24px; border-radius: 16px; } }
  .onb h1 { font-family:"Newsreader",serif; font-weight:500; font-size: clamp(28px,4.6vw,40px); letter-spacing:-.015em; line-height:1.06; margin: 12px 0 14px; }
  .onb .lead { font-size: 16px; line-height: 1.6; color: var(--text-dim); margin: 0 0 10px; }
  .onb .fine { font-size: 13px; color: var(--text-faint); margin: 6px 0 0; line-height: 1.5; }
  .fields { display: grid; gap: 13px; margin: 22px 0 4px; }
  .field { display: grid; gap: 6px; }
  .field span { font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .field input, .field select { padding: 12px 14px; border: var(--bw) solid var(--border); border-radius: 11px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 15px; width: 100%; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  /* make every form control clearly visible in all themes */
  .lp input, .lp select, .lp textarea { color-scheme: light dark; }
  .field input, .field select, .field2 input, .q-note, .nb textarea, .age-card select {
    border-color: color-mix(in srgb, var(--text-faint) 58%, var(--border)) !important;
    box-shadow: inset 0 1px 2px color-mix(in srgb, var(--text) 8%, transparent);
  }
  .field input::placeholder, .field2 input::placeholder, .q-note::placeholder, .nb textarea::placeholder { color: var(--text-faint); opacity: 1; }
  .field input:focus, .field2 input:focus, .q-note:focus, .nb textarea:focus, .age-card select:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft) !important; }
  .onb-actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .privacy-note { display: flex; gap: 10px; align-items: flex-start; margin-top: 20px; padding: 14px 16px; background: var(--surface-2); border-radius: 12px; font-size: 13.5px; color: var(--text-dim); line-height: 1.5; }
  .privacy-note .ic { color: var(--good); flex: none; margin-top: 1px; }

  /* questionnaire */
  .q-prog { margin-bottom: 18px; }
  .q-prog .lab { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 9px; }
  .q-prog .lab span { white-space: nowrap; }
  .q-prog .track { height: 7px; border-radius: 999px; background: var(--surface-2); border: var(--bw) solid var(--border); overflow: hidden; }
  .q-prog .fill { height: 100%; background: var(--accent); transition: width .35s ease; }
  .q-title { font-family:"Newsreader",serif; font-weight:500; font-size: 26px; line-height:1.15; letter-spacing:-.01em; margin: 14px 0 8px; }
  .q-copy { font-size: 15.5px; color: var(--text-dim); line-height: 1.55; margin: 0 0 6px; }
  .qopts { display: grid; gap: 10px; margin: 18px 0 0; }
  .qopt { text-align: left; cursor: pointer; border: var(--bw) solid var(--border); background: var(--surface); padding: 14px 16px; border-radius: 13px; font: inherit; font-size: 14.5px; line-height: 1.45; color: var(--text); display: flex; gap: 12px; align-items: flex-start; transition: all .15s; }
  .qopt:hover { border-color: var(--accent); }
  .qopt .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex: none; margin-top: 1px; display: grid; place-items: center; }
  .qopt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .qopt.sel .dot { border-color: var(--accent); }
  .qopt.sel .dot::after { content:""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  .qopt .num { color: var(--accent); font-weight: 700; }
  .q-note { width: 100%; min-height: 64px; margin-top: 14px; padding: 12px 14px; border: var(--bw) solid var(--border); border-radius: 12px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; resize: vertical; }
  .q-note:focus { outline: none; border-color: var(--accent); }
  .q-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
  .block-reason { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--bad); }

  /* age range — prominent, unmissable on Q1 */
  .age-card { display: block; margin: 4px 0 22px; padding: 18px 20px; border-radius: 16px;
    border: 2px solid var(--accent); background: var(--accent-soft); }
  .age-card.need { animation: agepulse 2s ease-in-out infinite; }
  @keyframes agepulse { 0%,100%{ box-shadow: 0 0 0 0 var(--accent-soft); } 50%{ box-shadow: 0 0 0 6px var(--accent-soft); } }
  .age-card .age-top { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .age-card .age-step { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; }
  .age-card .age-label { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; white-space: nowrap; }
  .age-card .age-req { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: var(--surface); padding: 4px 9px; border-radius: 999px; border: var(--bw) solid var(--accent); }
  .age-card .age-hint { font-size: 13px; color: var(--text-dim); margin: 2px 0 12px 33px; line-height: 1.45; }
  .age-card select { width: 100%; padding: 13px 15px; border: var(--bw) solid var(--border); border-radius: 11px; background: var(--surface); color: var(--text); font: inherit; font-size: 15.5px; font-weight: 600; }
  .age-card select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .age-card.done { border-color: var(--good); background: color-mix(in srgb, var(--good) 9%, var(--surface)); animation: none; }
  .age-card.done .age-step { background: var(--good); }
  .age-card.done .age-req { color: var(--good); border-color: var(--good); }

  /* ---------- dashboard ---------- */
  .view-head { padding: 32px 0 6px; }
  .view-head h1 { font-family:"Newsreader",serif; font-weight:500; font-size: clamp(28px,4vw,40px); letter-spacing:-.015em; line-height:1.05; margin: 10px 0 6px; }
  .view-head p { color: var(--text-dim); font-size: 16px; margin: 0; max-width: 60ch; line-height:1.5; }
  .mos-hero { background: var(--surface); border: var(--bw) solid var(--border); border-radius: 22px; box-shadow: 0 18px 50px var(--shadow); padding: 28px 30px; margin: 22px 0; }
  .mos-hero-grid { display: grid; grid-template-columns: minmax(0, 430px) 1fr; gap: 34px; align-items: center; }
  @media (max-width: 800px){ .mos-hero-grid { grid-template-columns: 1fr; } }
  .mos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .mtile { position: relative; aspect-ratio: 1/1; border-radius: 9px; overflow: hidden; border: var(--bw) solid var(--border); display: grid; place-items: center; transition: transform .15s, box-shadow .2s; }
  .mtile:hover { transform: scale(1.07); z-index: 2; box-shadow: 0 8px 22px var(--shadow); }
  .mtile .n { font-size: 12px; font-weight: 700; color: var(--text-faint); }
  .mtile.filled .n { color: rgba(255,255,255,.92); text-shadow: 0 1px 3px rgba(0,0,0,.55); position: absolute; left: 6px; bottom: 4px; font-size: 10px; }
  .mtile.justfill { animation: tilein .6s ease; }
  @keyframes tilein { 0%{ transform: scale(.7); filter: saturate(.4) brightness(1.3);} 60%{ transform: scale(1.12);} 100%{ transform: scale(1);} }
  .mos-side h2 { font-family:"Newsreader",serif; font-weight:500; font-size: 24px; margin: 0 0 6px; }
  .mos-cap { font-family:"Newsreader",serif; font-size: 17px; color: var(--text-dim); font-style: italic; margin: 0 0 16px; line-height:1.4; }
  .mos-meter .track { height: 9px; border-radius: 999px; background: var(--surface-2); border: var(--bw) solid var(--border); overflow: hidden; }
  .mos-meter .fill { height: 100%; background: linear-gradient(90deg, #d98a6a, #f4b66a); transition: width .5s ease; }
  .mos-meter .lab { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-faint); margin-top: 8px; font-weight: 600; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; margin-top: 18px; }
  .legend-row { display: flex; align-items: center; gap: 9px; font-size: 13px; }
  .legend-row .ld { width: 11px; height: 11px; border-radius: 4px; flex: none; }
  .legend-row .lc { color: var(--text-faint); margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 8px 0 22px; }
  @media (max-width:680px){ .stat-row { grid-template-columns: repeat(2,1fr); } }
  .stat { background: var(--surface); border: var(--bw) solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .stat strong { display: block; font-size: 26px; line-height: 1; font-family:"Newsreader",serif; font-weight:500; }
  .stat span { color: var(--text-dim); font-size: 13px; }
  .dash-cols { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; align-items: start; }
  @media (max-width:800px){ .dash-cols { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: var(--bw) solid var(--border); border-radius: 16px; padding: 22px 24px; }
  .panel h2 { font-family:"Newsreader",serif; font-weight:500; font-size: 21px; margin: 0 0 4px; }
  .panel .sub { color: var(--text-dim); font-size: 14px; margin: 0 0 14px; line-height:1.5; }
  .arc-bars { display: grid; gap: 12px; }
  .arc-bar .top { display: flex; justify-content: space-between; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  .arc-bar .top .c { color: var(--text-faint); font-weight: 600; }
  .arc-bar .track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: var(--bw) solid var(--border); }
  .arc-bar .fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
  .continue-card { display: flex; flex-direction: column; gap: 14px; }
  .continue-card .lessonref { display: flex; gap: 12px; align-items: center; padding: 14px; background: var(--surface-2); border-radius: 12px; }
  .continue-card .lnum { width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; }

  /* ---------- lessons catalog ---------- */
  .arc-sec { margin-top: 26px; }
  .arc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .arc-tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; }
  .arc-head h2 { font-family:"Newsreader",serif; font-weight:500; font-size: 22px; margin: 0; }
  .arc-head .ac { margin-left: auto; color: var(--text-faint); font-size: 13px; font-weight: 600; }
  .ltiles { display: grid; grid-template-columns: 1fr; gap: 9px; }
  .ltile { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border: var(--bw) solid var(--border); border-radius: 13px; background: var(--surface); cursor: pointer; transition: all .15s; text-align: left; font: inherit; color: var(--text); }
  .ltile:hover { border-color: var(--accent); transform: translateY(-1px); }
  .ltile .lnum { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; font-size: 14px; }
  .ltile.done .lnum { background: var(--good); color: #fff; }
  .ltile .lt-title { font-weight: 600; font-size: 15px; }
  .ltile .lt-q { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .ltile .lt-act { font-size: 12.5px; font-weight: 700; padding: 7px 13px; border-radius: 999px; background: var(--surface-2); color: var(--text-dim); white-space: nowrap; }
  .ltile .lt-act.next { background: var(--accent-soft); color: var(--accent); }
  .ltile.done .lt-act { color: var(--good); }

  /* ---------- lesson view ---------- */
  .lh { padding: 26px 0 8px; }
  .lh-strip { height: 5px; width: 64px; border-radius: 999px; margin-bottom: 16px; }
  .crumb { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .lh-title { font-family:"Newsreader",serif; font-weight:500; font-size: clamp(26px,3.6vw,40px); line-height:1.05; letter-spacing:-.015em; margin: 12px 0 8px; max-width: 20ch; }
  .coreq { font-size: 16px; color: var(--text-dim); font-style: italic; font-family:"Newsreader",serif; max-width: 60ch; margin: 0; }
  .rail { display: flex; gap: 6px; margin: 22px 0 4px; flex-wrap: wrap; }
  .rstep { display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 9px; border-radius: 999px; border: var(--bw) solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--text-faint); transition: all .2s; }
  .rstep .ix { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--surface-2); color: var(--text-faint); }
  .rstep.past { color: var(--text-dim); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
  .rstep.past .ix { background: var(--good); color: #fff; }
  .rstep.active { color: var(--on-accent); background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 14px var(--accent-soft); }
  .rstep.active .ix { background: rgba(255,255,255,.22); color: var(--on-accent); }
  .ws { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 22px; align-items: start; margin-top: 22px; }
  @media (max-width: 880px) { .ws { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: var(--bw) solid var(--border); border-radius: 20px; padding: 30px 32px; box-shadow: 0 18px 50px var(--shadow); }
  @media (max-width:560px){ .card { padding: 22px; border-radius: 16px; } }
  .kind { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--arc); background: color-mix(in srgb, var(--arc) 12%, transparent); padding: 7px 12px; border-radius: 999px; }
  .kind .ic { width: 15px; height: 15px; }
  .ctitle { font-family:"Newsreader",serif; font-weight:500; font-size: 26px; line-height:1.12; letter-spacing:-.01em; margin: 16px 0 12px; }
  .scenario { font-size: 18px; line-height: 1.6; margin: 0 0 12px; }
  .lead-q { font-size: 15px; color: var(--text-dim); margin: 16px 0 0; padding: 14px 16px; background: var(--surface-2); border-radius: 12px; border-left: 3px solid var(--arc); }
  .body { font-size: 16px; line-height: 1.65; margin: 0 0 4px; }
  .muted { color: var(--text-dim); font-size: 15px; line-height: 1.55; }
  .callout { border: var(--bw) solid var(--border); border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 10px; padding: 13px 16px; margin: 14px 0 0; font-size: 15px; line-height: 1.55; }
  .callout b { color: var(--text); }
  .callout.good { border-left-color: var(--good); } .callout.good b { color: var(--good); }
  .callout.bad { border-left-color: var(--bad); } .callout.bad b { color: var(--bad); }
  .turn { display: flex; align-items: center; gap: 10px; margin: 18px 0 6px; font-size: 13px; font-weight: 700; color: var(--arc); }
  .turn .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--arc); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%{ box-shadow:0 0 0 0 color-mix(in srgb,var(--arc) 55%,transparent);} 70%{ box-shadow:0 0 0 9px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }

  /* video step */

  .lp[data-reduce="1"] * { animation: none !important; }

        this.el('div', { className:'rhythm' },
          this.el('div', { className:'blk' }, this.el('div', { className:'big' }, '20'), this.el('div', { className:'cap' }, 'teach')),
          this.el('div', { className:'blk mid' }, this.el('div', { className:'big' }, '40'), this.el('div', { className:'cap' }, 'practice')),
          this.el('div', { className:'blk' }, this.el('div', { className:'big' }, '20'), this.el('div', { className:'cap' }, 'share'))),
        this.el('p', { className:'small' }, 'The learning happens in the iteration, not the explanation.'),
        this.el('h2', null, 'Start with a failure'),
        P('Give AI a vague prompt and let everyone watch it produce something generic. Then add context, role, examples, and constraints. The room sees the same tool become more useful because the human became more specific.'),
        this.el('div', { className:'compare2' },
          this.el('div', { className:'cmp bad' }, this.el('h4', null, 'Too abstract'), this.el('pre', null, 'Tell me about AI.'), this.el('p', null, 'Big topic, vague output, no clear use.')),
          this.el('div', { className:'cmp good' }, this.el('h4', null, 'Teachable'), this.el('pre', null, 'Act as a patient tutor for a 9th grader.\nExplain why AI can be confidently wrong.\nUse one analogy and end with a question.'), this.el('p', null, 'Clear audience, job, style, and output shape.'))),
        this.el('h2', null, 'Adults and students need different doors'),
        this.el('div', { className:'compare2' },
          this.el('div', { className:'cmp' }, this.el('h4', null, 'Adults'), this.el('p', null, 'Start with an existing workflow: email, meeting prep, research, lesson planning. They need to feel the time-back quickly, then you can talk about skill atrophy and verification.')),
          this.el('div', { className:'cmp' }, this.el('h4', null, 'Students'), this.el('p', null, 'Start with curiosity and identity. Let them stress-test AI, find mistakes, compare answers, and build small things. Do not lead with "this makes homework easier."'))),
        this.el('h2', null, 'The ethical core'),
        P('The strongest rule is not "AI is allowed" or "AI is banned." The better question is: ', S('what part of this work is supposed to grow my mind?'), ' If AI helps with that, use it. If AI removes that part, pause.'),
        this.el('div', { className:'callout-box' }, this.el('h4', null, 'Use this line'), this.el('p', null, 'AI should help you think better, not make it unnecessary to think.')),
        this.el('h2', null, 'Sustainable AI learning tools'),
        P('Use tools that match the learning goal instead of defaulting to the biggest model every time. For practice, smaller, local, or no-signup tools often teach more because learners can see the tradeoffs clearly.'),
        this.el('div', { className:'ingrid' }, tools.map(([n, t, d], k) => this.el('div', { key:k, className:'ingr' }, this.el('div', { className:'num' }, n), this.el('h4', null, t), this.el('p', null, d)))),
        this.el('div', { className:'callout-box good' }, this.el('h4', null, 'Good classroom test'), this.el('p', null, 'If students can explain what they did, what the AI contributed, what they checked, and what they still think themselves, the tool is supporting learning.'))));
  }

  main() {
    let body;
    switch (this.state.view) {
      case 'account': body = this.accountView(); break;
      case 'questionnaire': body = this.questionnaireView(); break;
      case 'lessons': body = this.lessonsView(); break;
      case 'lesson': body = this.lessonView(); break;
      case 'done': body = this.doneView(); break;
      case 'settings': body = this.settingsView(); break;
      case 'notes': body = this.notesView(); break;
      case 'about': body = this.aboutView(); break;
      case 'projects': body = this.projectsView(); break;
      case 'teaching': body = this.teachingView(); break;
      default: body = this.dashboardView();
    }
    return body;
  }

  renderVals() {
    return { theme: this.state.theme, fs: this.state.fontScale, reduce: this.state.reduceMotion ? '1' : '0', nav: this.nav(), main: this.main() };
  }
}
</script>
